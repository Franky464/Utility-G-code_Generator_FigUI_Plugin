<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utility-G-code Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg, #0c1018);
  color: var(--text-primary, #e2e6f4);
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 300px; min-width: 280px;
  background: var(--surface, #151c28);
  border-right: 1px solid var(--border, #222840);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.section {
  border-bottom: 1px solid var(--border, #222840);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 5px;
}
.section-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-muted, #6a7898);
  margin-bottom: 2px;
}
label { color: var(--text-muted, #6a7898); font-size: 12px; margin-top: 2px; }
input[type=number], input[type=text], select {
  width: 100%;
  background: var(--elevated, #1a2235);
  border: 1px solid var(--border, #222840);
  border-radius: 4px;
  color: var(--text-primary, #e2e6f4);
  font-size: 13px; padding: 5px 8px; outline: none;
}
input:focus, select:focus { border-color: var(--accent, #f0a030); }
select { cursor: pointer; }
.mode-select {
  font-size: 14px !important;
  font-weight: 600;
  border-color: var(--accent, #f0a030) !important;
  padding: 8px !important;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.generate-btn {
  margin: 12px; padding: 11px;
  background: var(--accent, #f0a030); color: #000;
  border: none; border-radius: 6px;
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.generate-btn:hover { filter: brightness(1.1); }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.main-split {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 2fr;
  min-height: 0;
  overflow: hidden;
}
.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.panel-left { border-right: 1px solid var(--border, #222840); }
.panel-header {
  flex-shrink: 0;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-muted, #6a7898);
  background: var(--surface, #151c28);
  border-bottom: 1px solid var(--border, #222840);
}
#gcode-output {
  flex: 1; width: 100%;
  background: var(--elevated, #1a2235);
  border: none; outline: none; resize: none;
  color: var(--text-primary, #e2e6f4);
  font-family: ui-monospace, monospace;
  font-size: 11px; line-height: 1.45;
  padding: 10px;
}
.viz-wrap {
  flex: 1;
  position: relative;
  background: #0a0e16;
  min-height: 0;
}
#preview-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.viz-legend {
  position: absolute;
  left: 8px; bottom: 8px;
  font-size: 11px;
  color: var(--text-muted, #6a7898);
  background: rgba(12,16,24,.85);
  border: 1px solid var(--border, #222840);
  border-radius: 4px;
  padding: 6px 8px;
  pointer-events: none;
}
.viz-legend span { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 6px; }
.leg-rapid { border-top: 2px dashed #64748b; height: 0; }
.leg-cut { background: #f0a030; }
.leg-start { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
.action-bar {
  padding: 8px 12px;
  background: var(--surface, #151c28);
  border-top: 1px solid var(--border, #222840);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.action-btn {
  padding: 7px 14px;
  background: var(--elevated, #1a2235);
  border: 1px solid var(--border, #222840);
  color: var(--text-primary, #e2e6f4);
  border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.action-btn:hover { border-color: var(--accent, #f0a030); }
.action-btn:disabled { opacity: .4; cursor: default; }
#status { font-size: 12px; color: var(--text-muted, #6a7898); flex: 1; text-align: right; }
#status.ok { color: #22c55e; }
#status.err { color: #ef4444; }
.hidden { display: none !important; }
@media (max-width: 900px) {
  .main-split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .panel-left { border-right: none; border-bottom: 1px solid var(--border, #222840); }
}
</style>

<style id="i18n-style">
.language-bar {
  position: fixed;
  top: 10px;
  right: 14px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 9px;
  background: rgba(20, 26, 38, .96);
  border: 1px solid #3b465d;
  border-radius: 8px;
  color: #dce3f2;
  font: 13px system-ui, sans-serif;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.language-bar select {
  background: #111722;
  color: #e8edf7;
  border: 1px solid #46536d;
  border-radius: 5px;
  padding: 3px 6px;
}
</style>


<script id="i18n-script">
const I18N = {
  fr: {
    language:"Langue", operationMode:"Mode d'opération", project:"Projet (commun)",
    projectName:"Nom projet", machine:"Machine", units:"Unités", plungePercent:"Plongée (%)",
    operation:"Opération", surfacing:"Surfaçage", contourDrilling:"Perçages par détourage",
    matrixDrilling:"Perçages matrice (RAST)", cornerRadius:"Rayon sur 90°", oblongHole:"Trou oblong",
    threading:"Filetage", clearance:"Dégagement Z", toolAndSpeeds:"Outil & vitesses",
    toolDiameter:"Ø outil (mm)", spindleSpeed:"Broche RPM", feedRate:"Feed (mm/min)",
    depthPerPass:"Prof. / passe", totalDepth:"Profondeur totale (mm)",
    startPosition:"Position départ (par mode)", startX:"Start X", startY:"Start Y", startZ:"Start Z",
    rastMatrix:"Matrice RAST", columns:"Colonnes", rows:"Lignes", pitchX:"Pas X", pitchY:"Pas Y",
    peckHeight:"Hauteur débourrage", generateGcode:"Générer G-code", preview:"Aperçu",
    settingsLoaded:"Réglages chargés", settingsSaved:"Réglages enregistrés",
    gcodeGeneratedPreviewOk:"G-code généré · aperçu OK",
    gcodeGeneratedSettingsError:"G-code généré · settings ÉCHEC",
    generateFirst:"Génère d’abord le G-code", saving:"Enregistrement…",
    loadedInViewer:"Chargé dans le viewer", previewEmpty:"Génère un G-code pour l’aperçu"
  },
  en: {
    language:"Language", operationMode:"Operation mode", project:"Project (common)",
    projectName:"Project name", machine:"Machine", units:"Units", plungePercent:"Plunge (%)",
    operation:"Operation", surfacing:"Surfacing", contourDrilling:"Contour drilling",
    matrixDrilling:"Matrix drilling (RAST)", cornerRadius:"90° corner radius", oblongHole:"Slot / oblong hole",
    threading:"Threading", clearance:"Z clearance", toolAndSpeeds:"Tool & speeds",
    toolDiameter:"Tool diameter (mm)", spindleSpeed:"Spindle RPM", feedRate:"Feed (mm/min)",
    depthPerPass:"Depth / pass", totalDepth:"Total depth (mm)",
    startPosition:"Start position (per mode)", startX:"Start X", startY:"Start Y", startZ:"Start Z",
    rastMatrix:"RAST matrix", columns:"Columns", rows:"Rows", pitchX:"X pitch", pitchY:"Y pitch",
    peckHeight:"Peck height", generateGcode:"Generate G-code", preview:"Preview",
    settingsLoaded:"Settings loaded", settingsSaved:"Settings saved",
    gcodeGeneratedPreviewOk:"G-code generated · preview OK",
    gcodeGeneratedSettingsError:"G-code generated · settings FAILED",
    generateFirst:"Generate the G-code first", saving:"Saving…",
    loadedInViewer:"Loaded in viewer", previewEmpty:"Generate G-code for the preview"
  }
};

function uiLang() {
  return (typeof settingsCache !== "undefined" &&
          (settingsCache.language === "en" || settingsCache.language === "fr"))
         ? settingsCache.language : "fr";
}
function t(key) {
  return (I18N[uiLang()] && I18N[uiLang()][key]) || I18N.fr[key] || key;
}
function applyLanguage() {
  const lang = uiLang();
  document.documentElement.lang = lang;
  const select = document.getElementById("language-select");
  if (select) select.value = lang;
  const label = document.getElementById("language-label");
  if (label) label.textContent = t("language");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });

  // Restore the operation selector labels from the translation table.
  document.querySelectorAll("#operation option[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
}

async function changeLanguage(lang) {
  if (lang !== "fr" && lang !== "en") lang = "fr";
  settingsCache.language = lang;
  applyLanguage();
  try { await saveSettings(); } catch (_) {}
}

document.addEventListener("DOMContentLoaded", () => {
  const select = document.getElementById("language-select");
  if (select) select.addEventListener("change", e => changeLanguage(e.target.value));
  applyLanguage();
});
</script>

<script>
/* ========== FigUI bridge ========== */
let msgId = 0;
const pending = {};
function call(method, params) {
  return new Promise((resolve, reject) => {
    const id = String(++msgId);
    pending[id] = { resolve, reject };
    window.parent.postMessage({ type: 'fluid-request', id, method, params: params ?? {} }, '*');
  });
}
window.addEventListener('message', e => {
  if (e.data?.type === 'fluid-response') {
    const p = pending[e.data.id];
    if (p) {
      delete pending[e.data.id];
      e.data.error ? p.reject(new Error(e.data.error)) : p.resolve(e.data.result);
    }
  }
});

let generatedCode = '';

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = cls || '';
}
function num(id, def) {
  const el = document.getElementById(id);
  if (!el) return def;
  const v = parseFloat(el.value);
  return Number.isFinite(v) ? v : def;
}
function str(id) {
  const el = document.getElementById(id);
  return el ? (el.value || '').trim() : '';
}
function fmt(v) { return Number(v).toFixed(3); }
function showModePanel(op) {
  document.querySelectorAll('.mode-panel').forEach(el => el.classList.add('hidden'));
  const panel = document.getElementById('panel-' + op);
  if (panel) panel.classList.remove('hidden');
}

/* ========== Preview 2D ========== */
function parseWord(line, letter) {
  const re = new RegExp(letter + '([-+]?\\d*\\.?\\d+(?:[eE][-+]?\\d+)?)', 'i');
  const m = line.match(re);
  return m ? parseFloat(m[1]) : null;
}

function parseGCodePaths(gcode) {
  const segs = [];
  let x = 0, y = 0, z = 0;
  let abs = true;
  let startSet = false;
  let startX = 0, startY = 0;
  const lines = String(gcode || '').split(/\r?\n/);

  function toAbs(nx, ny, nz) {
    return {
      x: nx == null ? x : (abs ? nx : x + nx),
      y: ny == null ? y : (abs ? ny : y + ny),
      z: nz == null ? z : (abs ? nz : z + nz)
    };
  }

  function addLine(x0, y0, x1, y1, rapid) {
    if (x0 === x1 && y0 === y1) return;
    segs.push({ type: rapid ? 'rapid' : 'cut', x0, y0, x1, y1 });
  }

  function addArc(x0, y0, x1, y1, i, j, cw) {
    const cx = x0 + (i || 0);
    const cy = y0 + (j || 0);
    let a0 = Math.atan2(y0 - cy, x0 - cx);
    let a1 = Math.atan2(y1 - cy, x1 - cx);
    let da = a1 - a0;
    if (cw) {
      if (da > 0) da -= 2 * Math.PI;
      if (Math.abs(da) < 1e-9) da = -2 * Math.PI;
    } else {
      if (da < 0) da += 2 * Math.PI;
      if (Math.abs(da) < 1e-9) da = 2 * Math.PI;
    }
    const r = Math.hypot(x0 - cx, y0 - cy) || Math.hypot(x1 - cx, y1 - cy);
    const n = Math.max(8, Math.min(72, Math.ceil(Math.abs(da) / (Math.PI / 24))));
    let px = x0, py = y0;
    for (let k = 1; k <= n; k++) {
      const a = a0 + da * (k / n);
      const qx = cx + r * Math.cos(a);
      const qy = cy + r * Math.sin(a);
      segs.push({ type: 'cut', x0: px, y0: py, x1: qx, y1: qy });
      px = qx; py = qy;
    }
  }

  for (let raw of lines) {
    let line = raw.replace(/;.*$/, '').replace(/\(.*?\)/g, '').trim();
    if (!line) continue;
    if (/^G90\b/i.test(line)) { abs = true; continue; }
    if (/^G91\b/i.test(line)) { abs = false; continue; }

    const gMatch = line.match(/\bG0*(\d+)\b/i);
    const g = gMatch ? parseInt(gMatch[1], 10) : null;
    if (g == null && !/[XYZIJK]/i.test(line)) continue;

    const nx = parseWord(line, 'X');
    const ny = parseWord(line, 'Y');
    const nz = parseWord(line, 'Z');
    const ni = parseWord(line, 'I');
    const nj = parseWord(line, 'J');
    const p = toAbs(nx, ny, nz);

    if (!startSet && (nx != null || ny != null)) {
      startX = p.x; startY = p.y; startSet = true;
    }

    if (g === 0 || g === 00) {
      addLine(x, y, p.x, p.y, true);
      x = p.x; y = p.y; z = p.z;
    } else if (g === 1) {
      addLine(x, y, p.x, p.y, false);
      x = p.x; y = p.y; z = p.z;
    } else if (g === 2 || g === 3) {
      addArc(x, y, p.x, p.y, ni || 0, nj || 0, g === 2);
      x = p.x; y = p.y; z = p.z;
    } else if (nx != null || ny != null || nz != null) {
      // continuation without explicit G → treat as last motion type is hard; skip pure Z
      if (nx != null || ny != null) {
        addLine(x, y, p.x, p.y, false);
        x = p.x; y = p.y;
      }
      z = p.z;
    }
  }
  return { segs, startX, startY, startSet };
}

function drawPreview(gcode) {
  const canvas = document.getElementById('preview-canvas');
  const wrap = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(50, wrap.clientWidth);
  const h = Math.max(50, wrap.clientHeight);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0e16';
  ctx.fillRect(0, 0, w, h);

  const { segs, startX, startY, startSet } = parseGCodePaths(gcode);
  if (!segs.length) {
    ctx.fillStyle = '#6a7898';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Génère un G-code pour l’aperçu', w / 2, h / 2);
    return;
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of segs) {
    minX = Math.min(minX, s.x0, s.x1);
    maxX = Math.max(maxX, s.x0, s.x1);
    minY = Math.min(minY, s.y0, s.y1);
    maxY = Math.max(maxY, s.y0, s.y1);
  }
  if (startSet) {
    minX = Math.min(minX, startX); maxX = Math.max(maxX, startX);
    minY = Math.min(minY, startY); maxY = Math.max(maxY, startY);
  }
  // Inclure (0,0) dans le cadrage pour toujours voir l’origine
  minX = Math.min(minX, 0); maxX = Math.max(maxX, 0);
  minY = Math.min(minY, 0); maxY = Math.max(maxY, 0);

  const pad = 28;
  const dx = Math.max(1e-6, maxX - minX);
  const dy = Math.max(1e-6, maxY - minY);
  const scale = Math.min((w - 2 * pad) / dx, (h - 2 * pad) / dy);
  const ox = (w - dx * scale) / 2 - minX * scale;
  const oy = (h + dy * scale) / 2 + minY * scale;

  function tx(x) { return ox + x * scale; }
  function ty(y) { return oy - y * scale; }

  function fmtL(v) {
    const a = Math.abs(v);
    if (a >= 100) return v.toFixed(1);
    if (a >= 10) return v.toFixed(2);
    return v.toFixed(2);
  }

  // Axes X=0 / Y=0
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(tx(minX), ty(0));
  ctx.lineTo(tx(maxX), ty(0));
  ctx.moveTo(tx(0), ty(minY));
  ctx.lineTo(tx(0), ty(maxY));
  ctx.stroke();
  ctx.setLineDash([]);

  // Cadre bounds
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.strokeRect(tx(minX), ty(maxY), (maxX - minX) * scale, (maxY - minY) * scale);

  // Segments parcours
  for (const s of segs) {
    ctx.beginPath();
    ctx.moveTo(tx(s.x0), ty(s.y0));
    ctx.lineTo(tx(s.x1), ty(s.y1));
    if (s.type === 'rapid') {
      ctx.strokeStyle = '#64748b';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = '#f0a030';
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Point départ
  if (startSet) {
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(tx(startX), ty(startY), 12, 0, Math.PI * 2); // diamètre ×3 (rayon 4 → 12)
    ctx.fill();
  }

  // Point origine (0,0)
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(tx(0), ty(0), 4, 0, Math.PI * 2);
  ctx.fill();

  // Labels
  ctx.font = '11px ui-monospace, monospace';
  ctx.textBaseline = 'middle';

  function labelAt(x, y, text, anchor) {
    // anchor: 'left' | 'right' | 'top' | 'bottom' | 'center'
    const px = tx(x);
    const py = ty(y);
    let ax = 0, ay = 0;
    if (anchor === 'left') { ctx.textAlign = 'left'; ax = 6; }
    else if (anchor === 'right') { ctx.textAlign = 'right'; ax = -6; }
    else { ctx.textAlign = 'center'; }
    if (anchor === 'top') ay = -10;
    else if (anchor === 'bottom') ay = 12;
    else if (anchor === 'left' || anchor === 'right') ay = 0;
    else ay = -12;

    const tw = ctx.measureText(text).width;
    const bx = px + ax - (ctx.textAlign === 'center' ? tw / 2 : ctx.textAlign === 'right' ? tw : 0);
    const by = py + ay - 7;
    ctx.fillStyle = 'rgba(10,14,22,0.75)';
    ctx.fillRect(bx - 3, by, tw + 6, 14);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(text, px + ax, py + ay);
  }

  // Origine
  labelAt(0, 0, 'X0,Y0', 'bottom');

  // Extents
  labelAt(minX, (minY + maxY) / 2, 'Xmin ' + fmtL(minX), 'right');
  labelAt(maxX, (minY + maxY) / 2, 'Xmax ' + fmtL(maxX), 'left');
  labelAt((minX + maxX) / 2, minY, 'Ymin ' + fmtL(minY), 'top');
  labelAt((minX + maxX) / 2, maxY, 'Ymax ' + fmtL(maxY), 'bottom');
}

window.addEventListener('resize', () => {
  if (generatedCode) drawPreview(generatedCode);
});

}

    depth_per_pass:'depth_per_pass', total_depth:'total_depth', hole_diameter:'hole_diameter',

    thread_type:'thread_type', path_type_thread:'path_type', thread_pitch:'thread_pitch',

  }}
};

let settingsCache = {
  last_operation: '1', project_name: 'test', machine: 'CNC_450x800',
  global_units: 'mm', global_feed_rate_percent: '50%', language: 'fr',
  surfacing: {}, contour_drilling: {}, matrix_drilling: {},
  corner_radius: {}, oblong_hole: {}, threading: {}
};

function parseFieldValue(el) {
  const v = el.value;
  if (el.tagName === 'SELECT' || el.type === 'text') return v;
  const n = parseFloat(v);
  return (v !== '' && Number.isFinite(n)) ? n : v;
}
function readModeFromForm(op) {
  const map = MODE_MAP[op];
  if (!map) return {};
  const obj = {};
  for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
    const el = document.getElementById(htmlId);
    if (el) obj[jsonKey] = parseFieldValue(el);
  }
  return obj;
}
function writeModeToForm(op, section) {
  const map = MODE_MAP[op];
  if (!map || !section) return;
  for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
    const el = document.getElementById(htmlId);
    if (el && section[jsonKey] !== undefined && section[jsonKey] !== null) el.value = section[jsonKey];
  }
}
function captureMode(op) {
  const map = MODE_MAP[op];
  if (!map) return;
  settingsCache[map.key] = readModeFromForm(op);
  settingsCache.last_operation = op;
  settingsCache.project_name = str('project_name') || 'test';
  settingsCache.machine = str('machine') || 'CNC';
  settingsCache.global_units = str('global_units') || 'mm';
  settingsCache.global_feed_rate_percent = (str('plunge_percent') || '50') + '%';
}
async function saveSettings() {
  captureMode(str('operation') || '1');
  try {
    await call('writeFile', { path: settingsPath(), content: JSON.stringify(settingsCache, null, 4), fs: 'sd' });
    return true;
  } catch (e) {
    setStatus('Settings: ' + (e.message || e), 'err');
    return false;
  }
}
async function loadSettings() {
  try {
    const text = await call('readFile', { path: settingsPath(), fs: 'sd' });
    const s = JSON.parse(text);
    if (s && typeof s === 'object') {
      if (s.surfacing || s.threading || s.last_operation) Object.assign(settingsCache, s);
      else {
        const op = String(s.operation || '1');
        settingsCache.last_operation = op;
        settingsCache.project_name = s.project_name || settingsCache.project_name;
        settingsCache.machine = s.machine || settingsCache.machine;
        settingsCache.global_units = s.global_units || 'mm';
        if (s.plunge_percent !== undefined) settingsCache.global_feed_rate_percent = String(s.plunge_percent).replace('%','') + '%';
        const map = MODE_MAP[op];
        if (map) {
          const section = {};
          for (const [htmlId, jsonKey] of Object.entries(map.fields)) {
            if (s[htmlId] !== undefined) {
              const n = parseFloat(s[htmlId]);
              section[jsonKey] = Number.isFinite(n) && document.getElementById(htmlId)?.tagName !== 'SELECT' ? n : s[htmlId];
            }
          }
          settingsCache[map.key] = section;
        }
      }
    }
  } catch (_) {}
  const op = String(settingsCache.last_operation || '1');
  document.getElementById('operation').value = op;
  document.getElementById('project_name').value = settingsCache.project_name || 'test';
  document.getElementById('machine').value = settingsCache.machine || 'CNC';
  document.getElementById('global_units').value = settingsCache.global_units || 'mm';
  document.getElementById('plunge_percent').value = String(settingsCache.global_feed_rate_percent || '50%').replace('%','').trim() || '50';
  showModePanel(op);
  const map = MODE_MAP[op];
  if (map && settingsCache[map.key]) writeModeToForm(op, settingsCache[map.key]);
  setStatus('Réglages chargés', 'ok');
}

(function bindModeSelect() {
  const sel = document.getElementById('operation');
  let prevOp = sel.value;
  sel.addEventListener('mousedown', () => { prevOp = sel.value; });
  sel.addEventListener('focus', () => { prevOp = sel.value; });
  sel.addEventListener('change', async () => {
    captureMode(prevOp);
    const newOp = sel.value;
    showModePanel(newOp);
    const map = MODE_MAP[newOp];
    if (map && settingsCache[map.key] && Object.keys(settingsCache[map.key]).length) writeModeToForm(newOp, settingsCache[map.key]);
    settingsCache.last_operation = newOp;
    await saveSettings();
    prevOp = newOp;
    setStatus('Mode ' + newOp + ' chargé', 'ok');
  });
})();

/* ========== Générateurs (inchangés) ========== */
function generateHeader(p, stockX, stockY, stockZ) {
  const now = new Date().toISOString().replace('T', ' ').slice(0, 19);
  const units = p.global_units === 'in' ? 'G20' : 'G21';
  return [
    '; NC from Utility-G-code Generator (FigUI)',
    '; ' + p.project_name, '; ' + now, '; ' + p.machine,
    `; (${fmt(stockX)}, ${fmt(stockY)}, ${fmt(stockZ)} ${p.global_units})`,
    `${units} ;(${p.global_units})`, 'G90', `M3 S${Math.round(p.spindle_speed)}`, 'G04 P5', ''
  ].join('\n');
}
function footer(clearance) {
  return [`G00 Z${fmt(clearance)}`, 'G90', 'M5', 'M30'].join('\n');
}

function genSurfacing(p) {
  const pathCode = { conventional: '1', climb: '2', alternate: '3' }[p.path_type] || '1';
  const labels = { conventional: 'Opposition', climb: 'Avalant', alternate: 'Alterné' };
  if (p.depth_per_pass > p.total_depth) throw new Error('Profondeur/passe > profondeur totale');
  if (p.overlap_percent < 0 || p.overlap_percent >= 100) throw new Error('Chevauchement 0–99%');
  const stepOver = p.tool_diameter * (1 - p.overlap_percent / 100);
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const numPassesY = Math.ceil(p.length_y / stepOver);
  const offset = p.tool_diameter / 2;
  const initialX = p.start_x - offset, initialY = p.start_y - offset;
  const endX = p.start_x + p.width_x, endY = p.start_y + p.length_y;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  let g = [];
  g.push(`; Surfacing (${labels[p.path_type] || 'Opposition'})`);
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  if (pathCode === '2') g.push(`G00 X${fmt(initialX)} Y${fmt(endY)}`);
  else g.push(`G00 X${fmt(initialX)} Y${fmt(initialY)}`);
  let currentZ = p.start_z;
  for (let i = 0; i < numPassesZ; i++) {
    currentZ -= Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    g.push(`; Pass ${i + 1} at Z=${fmt(currentZ)}`);
    g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
    let currentY = initialY;
    for (let j = 0; j < numPassesY; j++) {
      if (currentY > p.start_y + p.length_y) break;
      if (pathCode === '3') {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(j % 2 === 0 ? `G01 X${fmt(endX)} F${Math.round(p.feed_rate)}` : `G01 X${fmt(p.start_x)} F${Math.round(p.feed_rate)}`);
      } else if (pathCode === '2') {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(`G01 X${fmt(p.start_x)} F${Math.round(p.feed_rate)}`);
        if (currentY + stepOver <= p.start_y + p.length_y) g.push(`G00 X${fmt(endX)}`);
      } else {
        g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
        g.push(`G01 X${fmt(endX)} F${Math.round(p.feed_rate)}`);
        if (currentY + stepOver <= p.start_y + p.length_y) g.push(`G00 X${fmt(p.start_x)}`);
      }
      currentY += stepOver;
    }
    if (currentY <= p.start_y + p.length_y) g.push(`G01 Y${fmt(currentY)} F${Math.round(p.feed_rate)}`);
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  return { body: g.join('\n'), stockX: p.width_x + p.tool_diameter, stockY: p.length_y + p.tool_diameter, stockZ: p.total_depth + p.clearance_height };
}

function genContour(p) {
  if (p.hole_diameter <= p.tool_diameter) throw new Error('Ø trou doit être > Ø outil');
  if (p.depth_per_pass > p.total_depth) throw new Error('Profondeur/passe > totale');
  const isBlind = p.drilling_type === 'blind';
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const holeR = p.hole_diameter / 2, toolR = p.tool_diameter / 2;
  let circleR, numCircles, stepOver = 0;
  if (p.drilling_type === 'outer') { circleR = holeR + toolR; numCircles = 1; }
  else {
    circleR = holeR - toolR;
    if (isBlind) {
      stepOver = p.tool_diameter * (1 - p.overlap_percent / 100);
      numCircles = Math.floor((holeR - toolR) / stepOver) + 1;
    } else numCircles = 1;
  }
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const pathIsConv = p.path_type === 'conventional';
  let g = [];
  g.push('; Contour drilling');
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  let currentZ = p.start_z;
  for (let i = 0; i < numPassesZ; i++) {
    currentZ -= Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    g.push(`; Pass ${i + 1} at Z=${fmt(currentZ)}`);
    for (let j = 0; j < numCircles; j++) {
      let r = isBlind ? circleR - j * stepOver : circleR;
      if (isBlind && r < toolR) r = toolR;
      const tx = p.start_x + r;
      g.push(`G00 X${fmt(tx)} Y${fmt(p.start_y)}`);
      g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
      g.push(pathIsConv
        ? `G02 X${fmt(tx)} Y${fmt(p.start_y)} I${fmt(-r)} J0.000 F${Math.round(p.feed_rate)}`
        : `G03 X${fmt(tx)} Y${fmt(p.start_y)} I${fmt(-r)} J0.000 F${Math.round(p.feed_rate)}`);
    }
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  const stock = p.drilling_type === 'outer' ? p.hole_diameter + 2 * p.tool_diameter : p.hole_diameter + p.tool_diameter;
  return { body: g.join('\n'), stockX: stock, stockY: stock, stockZ: p.total_depth + p.clearance_height };
}

function genMatrix(p) {
  if (p.num_cols < 1 || p.num_rows < 1) throw new Error('Nb colonnes/lignes >= 1');
  if (p.depth_per_pass > p.total_depth) throw new Error('Profondeur/passe > totale');
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const plunge = p.feed_rate * p.plunge_percent / 100;
  let g = [];
  g.push('; Matrix drilling RAST');
  g.push(`; ${p.num_cols} x ${p.num_rows} holes`);
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
  for (let j = 0; j < p.num_rows; j++) {
    const cy = p.start_y + j * p.spacing_y;
    let xs = [];
    for (let i = 0; i < p.num_cols; i++) xs.push(p.start_x + i * p.spacing_x);
    if (j % 2 === 1) xs.reverse();
    for (const cx of xs) {
      g.push(`; Hole X=${fmt(cx)} Y=${fmt(cy)}`);
      g.push(`G00 X${fmt(cx)} Y${fmt(cy)}`);
      let currentZ = p.start_z;
      for (let k = 0; k < numPassesZ; k++) {
        currentZ -= Math.min(p.depth_per_pass, p.total_depth - k * p.depth_per_pass);
        g.push(`G01 Z${fmt(currentZ)} F${fmt(plunge)}`);
        if (k < numPassesZ - 1) g.push(`G00 Z${fmt(p.deburr_height)}`);
      }
      g.push(`G00 Z${fmt(p.clearance_height)}`);
    }
  }
  return {
    body: g.join('\n'),
    stockX: p.num_cols > 1 ? (p.num_cols - 1) * p.spacing_x : 10,
    stockY: p.num_rows > 1 ? (p.num_rows - 1) * p.spacing_y : 10,
    stockZ: p.total_depth + p.clearance_height
  };
}

function genCorner(p) {
  if (p.radius <= 0 || p.tool_diameter <= 0) throw new Error('Rayon et Ø outil > 0');
  if (p.depth_per_pass > p.total_depth) throw new Error('Profondeur/passe > totale');
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const arcR = p.radius + p.tool_diameter / 2;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const conv = p.path_type === 'conventional';
  let arcCmd, returnX, returnY;
  if (p.corner_type === 'front_left') {
    if (conv) { arcCmd = `G03 X${fmt(arcR)} Y-${fmt(arcR)} I${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
    else { arcCmd = `G02 X-${fmt(arcR)} Y${fmt(arcR)} I0.000 J${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
  } else if (p.corner_type === 'front_right') {
    if (conv) { arcCmd = `G03 X${fmt(arcR)} Y${fmt(arcR)} I0.000 J${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
    else { arcCmd = `G02 X-${fmt(arcR)} Y-${fmt(arcR)} I-${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
  } else if (p.corner_type === 'rear_right') {
    if (conv) { arcCmd = `G03 X-${fmt(arcR)} Y${fmt(arcR)} I-${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
    else { arcCmd = `G02 X${fmt(arcR)} Y-${fmt(arcR)} I0.000 J-${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
  } else {
    if (conv) { arcCmd = `G03 X-${fmt(arcR)} Y-${fmt(arcR)} I0.000 J-${fmt(arcR)} F${Math.round(p.feed_rate)}`; returnX = `G00 X${fmt(arcR)}`; returnY = `G00 Y${fmt(arcR)}`; }
    else { arcCmd = `G02 X${fmt(arcR)} Y${fmt(arcR)} I${fmt(arcR)} J0.000 F${Math.round(p.feed_rate)}`; returnX = `G00 X-${fmt(arcR)}`; returnY = `G00 Y-${fmt(arcR)}`; }
  }
  let g = [];
  g.push('; Corner radius 90°');
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push(`G00 Z${fmt(p.clearance_height)} F${Math.round(p.feed_rate)}`);
  g.push('G91');
  for (let i = 0; i < numPassesZ; i++) {
    const depth = Math.min(p.depth_per_pass, p.total_depth - i * p.depth_per_pass);
    const targetZ = p.start_z - (i * p.depth_per_pass + depth);
    g.push(`; Pass ${i + 1} at Z=${fmt(targetZ)}`);
    g.push('G90');
    g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
    g.push('G91');
    g.push(arcCmd);
    g.push('G90');
    g.push(`G00 Z${fmt(p.clearance_height)}`);
    if (i < numPassesZ - 1) { g.push('G91'); g.push(returnX); g.push(returnY); }
  }
  return { body: g.join('\n'), stockX: arcR * 2, stockY: arcR * 2, stockZ: p.clearance_height + p.total_depth };
}

function genOblong(p) {
  if (p.width < p.tool_diameter) throw new Error('Largeur >= Ø outil');
  if (p.depth_per_pass > p.total_depth) throw new Error('Profondeur/passe > totale');
  const numPassesZ = Math.ceil(p.total_depth / p.depth_per_pass);
  const halfW = (p.width - p.tool_diameter) / 2, halfLx = p.length_x / 2, halfLy = p.length_y / 2;
  const plunge = p.feed_rate * p.plunge_percent / 100;
  const conv = p.path_type === 'conventional';
  let g = [];
  g.push('; Oblong hole');
  g.push(`G0 S${Math.round(p.spindle_speed)} F${Math.round(p.feed_rate)}`);
  g.push('G90');
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
  for (let i = 0; i < numPassesZ; i++) {
    const targetZ = p.start_z - Math.min((i + 1) * p.depth_per_pass, p.total_depth);
    g.push(`; Pass ${i + 1} at Z=${fmt(targetZ)}`);
    if (conv) {
      g.push('G90');
      g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y - halfW)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
      g.push('G91');
      g.push(`G00 X${fmt(-halfLx)} Y${fmt(-halfLy)}`);
      g.push(`G02 X${fmt(-halfW)} Y${fmt(halfW)} I0.000 J${fmt(halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(halfW)} Y${fmt(halfW)} I${fmt(halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(halfW)} Y${fmt(-halfW)} I0.000 J${fmt(-halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(-p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G02 X${fmt(-halfW)} Y${fmt(-halfW)} I${fmt(-halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(-p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push('G90');
    } else {
      g.push('G90');
      g.push(`G00 X${fmt(p.start_x - halfW)} Y${fmt(p.start_y - p.length_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 Z${fmt(targetZ)} F${fmt(plunge)}`);
      g.push('G91');
      g.push(`G00 X${fmt(-halfLx)} Y${fmt(halfLy)}`);
      g.push(`G03 X${fmt(halfW)} Y${fmt(-halfW)} I${fmt(halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(halfW)} Y${fmt(halfW)} I0.000 J${fmt(halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(-halfW)} Y${fmt(halfW)} I${fmt(-halfW)} J0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G01 X${fmt(-p.length_x)} Y0.000 F${Math.round(p.feed_rate)}`);
      g.push(`G03 X${fmt(-halfW)} Y${fmt(-halfW)} I0.000 J${fmt(-halfW)} F${Math.round(p.feed_rate)}`);
      g.push(`G01 X0.000 Y${fmt(-p.length_y)} F${Math.round(p.feed_rate)}`);
      g.push('G90');
    }
  }
  g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)} Z${fmt(p.start_z)}`);
  g.push('G90');
  return { body: g.join('\n'), stockX: p.length_x + p.tool_diameter, stockY: p.length_y + p.tool_diameter, stockZ: p.start_z + p.total_depth };
}

function genThreading(p) {
  if (p.hole_diameter <= p.tool_diameter) throw new Error('Ø trou > Ø outil');
  if (p.thread_pitch <= 0 || p.thread_number <= 0) throw new Error('Pas et nb filets > 0');
  const numRadial = Math.ceil(p.total_depth / p.depth_per_pass);
  const holeR = p.hole_diameter / 2, toolR = p.tool_diameter / 2;
  const arcCode = p.path_type === 'left' ? 'G03' : 'G02';
  const isNut = p.thread_type === 'nut_internal';
  let g = [];
  g.push('; Threading');
  g.push(`G00 Z${fmt(p.clearance_height)} S${Math.round(p.spindle_speed)}`);
  if (isNut) {
    const baseX = holeR - p.depth_per_pass - toolR - p.total_depth;
    g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
    for (let pass = 1; pass <= numRadial; pass++) {
      const currentX = baseX + (pass + 1) * p.depth_per_pass;
      g.push(`G01 X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)}`);
      for (let turn = 1; turn <= p.thread_number; turn++) {
        g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000 Z${fmt(p.start_z - p.thread_pitch * turn)}`);
      }
      g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000`);
      g.push(`G00 X${fmt(p.start_x)} Y${fmt(p.start_y)}`);
      if (pass < numRadial) g.push(`G00 Z${fmt(p.start_z)}`);
    }
  } else {
    const baseX = holeR - p.depth_per_pass + toolR;
    const retractX = p.start_x + holeR + toolR + p.total_depth;
    g.push(`G00 X${fmt(retractX)} Y${fmt(p.start_y)} Z${fmt(p.start_z)} F${Math.round(p.feed_rate)}`);
    for (let pass = 1; pass <= numRadial; pass++) {
      const currentX = baseX - pass * p.depth_per_pass + p.depth_per_pass;
      g.push(`G01 X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)}`);
      for (let turn = 1; turn <= p.thread_number; turn++) {
        g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000 Z${fmt(p.start_z - p.thread_pitch * turn)}`);
      }
      g.push(`${arcCode} X${fmt(p.start_x + currentX)} Y${fmt(p.start_y)} I${fmt(-currentX)} J0.000`);
      g.push(`G00 X${fmt(retractX)} Y${fmt(p.start_y)}`);
      if (pass < numRadial) g.push(`G00 Z${fmt(p.start_z)}`);
    }
  }
  g.push(`G00 Z${fmt(p.clearance_height)}`);
  const stock = p.hole_diameter + p.tool_diameter;
  return { body: g.join('\n'), stockX: stock, stockY: stock, stockZ: p.total_depth + p.clearance_height };
}

function collectParams() {
  const op = str('operation');
  const base = {
    operation: op,
    project_name: str('project_name') || 'test',
    machine: str('machine') || 'CNC',
    global_units: str('global_units') || 'mm',
    plunge_percent: Math.min(100, Math.max(1, num('plunge_percent', 50))),
    start_x: num('start_x', 0), start_y: num('start_y', 0), start_z: num('start_z', 0),
    clearance_height: Math.max(0.1, num('clearance_height', 5)),
    tool_diameter: Math.max(0.1, num('tool_diameter', 10)),
    spindle_speed: Math.max(0, num('spindle_speed', 1000)),
    feed_rate: Math.max(1, num('feed_rate', 1800)),
    depth_per_pass: Math.max(0.01, num('depth_per_pass', 1)),
    total_depth: Math.max(0.01, num('total_depth', 2))
  };
  if (op === '1') return { ...base, width_x: Math.max(0.1, num('width_x', 100)), length_y: Math.max(0.1, num('length_y', 100)), overlap_percent: Math.min(99, Math.max(0, num('overlap_percent', 50))), path_type: str('path_type_surf') || 'conventional' };
  if (op === '2') return { ...base, hole_diameter: Math.max(0.1, num('hole_diameter', 30)), drilling_type: str('drilling_type') || 'contour', path_type: str('path_type_contour') || 'conventional', overlap_percent: Math.min(99, Math.max(0, num('overlap_blind', 50))) };
  if (op === '3') return { ...base, num_cols: Math.max(1, Math.round(num('num_cols', 1))), num_rows: Math.max(1, Math.round(num('num_rows', 1))), spacing_x: Math.max(0, num('spacing_x', 10)), spacing_y: Math.max(0, num('spacing_y', 10)), deburr_height: Math.max(0.1, num('deburr_height', 2)) };
  if (op === '4') return { ...base, radius: Math.max(0.1, num('radius', 10)), corner_type: str('corner_type') || 'front_left', path_type: str('path_type_corner') || 'conventional' };
  if (op === '5') return { ...base, length_x: Math.max(0, num('ob_length_x', 20)), length_y: Math.max(0, num('ob_length_y', 20)), width: Math.max(0.1, num('ob_width', 10)), path_type: str('path_type_oblong') || 'conventional' };
  if (op === '6') return { ...base, hole_diameter: Math.max(0.1, num('th_hole_diameter', 30)), thread_type: str('thread_type') || 'nut_internal', path_type: str('path_type_thread') || 'right', thread_pitch: Math.max(0.01, num('thread_pitch', 1.5)), thread_number: Math.max(1, Math.round(num('thread_number', 6))) };
  return base;
}

async function generate() {
  try {
    const p = collectParams();
    let result;
    switch (p.operation) {
      case '1': result = genSurfacing(p); break;
      case '2': result = genContour(p); break;
      case '3': result = genMatrix(p); break;
      case '4': result = genCorner(p); break;
      case '5': result = genOblong(p); break;
      case '6': result = genThreading(p); break;
      default: throw new Error('Mode inconnu');
    }
    generatedCode = generateHeader(p, result.stockX, result.stockY, result.stockZ) + '\n' + result.body + '\n' + footer(p.clearance_height);
    document.getElementById('gcode-output').value = generatedCode;
    document.getElementById('open-btn').disabled = false;
    requestAnimationFrame(() => drawPreview(generatedCode));
    const ok = await saveSettings();
    setStatus(ok ? 'G-code généré · aperçu OK' : 'G-code généré · settings ÉCHEC', ok ? 'ok' : 'err');
  } catch (e) {
    setStatus(e.message || String(e), 'err');
  }
}

async function openInViewer() {
  if (!generatedCode) { setStatus('Génère d’abord le G-code', 'err'); return; }
  const p = collectParams();
  const safe = (p.project_name || 'test').replace(/[<>:"/\\|?*]/g, '_');
  const names = { '1': 'surf', '2': 'contour', '3': 'matrix', '4': 'corner', '5': 'oblong', '6': 'thread' };
  const path = `/sd/${names[p.operation] || 'op'}_${safe}.nc`;
  try {
    await saveSettings();
    setStatus('Enregistrement…', '');
    await call('writeFile', { path, content: generatedCode, fs: 'sd' });
    let loaded = false;
    for (const t of [
      { method: 'loadFile', params: { path, fs: 'sd' } },
      { method: 'openFile', params: { path, fs: 'sd' } },
      { method: 'loadGcode', params: { path, fs: 'sd' } },
      { method: 'previewFile', params: { path, fs: 'sd' } }
    ]) {
      try { await call(t.method, t.params); loaded = true; break; } catch (_) {}
    }
    setStatus(loaded ? 'Chargé dans le viewer' : 'Sauvé : ' + path + ' — ouvre dans Files', 'ok');
    setTimeout(() => { try { call('close'); } catch (_) {} }, 400);
  } catch (e) {
    setStatus('Erreur : ' + (e.message || e), 'err');
  }
}

loadSettings().finally(() => applyLanguage());
setTimeout(() => drawPreview(''), 50);
</script>
